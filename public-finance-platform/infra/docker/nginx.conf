events {
    worker_connections 1024;
}

http {
    # Docker's embedded DNS. Combined with the $api/$web variables below this
    # resolves upstreams per request instead of once at startup, so nginx
    # neither refuses to boot when a backend is still down nor keeps proxying
    # to a stale IP after `docker compose up -d` recreates one.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        server_name _;

        # A variable in proxy_pass with no URI part leaves the request URI
        # untouched, matching the plain `proxy_pass http://api;` form.
        set $api http://api:8000;
        set $web http://web:3000;

        # FastAPI routes (REST + Swagger)
        location /api/ {
            proxy_pass         $api;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location /docs {
            proxy_pass         $api;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }

        location /openapi.json {
            proxy_pass         $api;
            proxy_set_header   Host $host;
        }

        # Next.js app (including HMR websocket in dev)
        location / {
            proxy_pass         $web;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
        }
    }
}
