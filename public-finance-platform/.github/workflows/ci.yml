name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install JS dependencies
        run: pnpm install

      - name: Lint web
        run: pnpm lint:web

      - name: Test web
        run: pnpm test:web

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -r apps/api/requirements.txt
          python -m pip install -r apps/worker/requirements.txt
          python -m pip install -e packages/shared-py

      - name: Lint Python
        run: ruff check apps/api apps/worker packages/shared-py

      - name: Format check Python
        run: black --check apps/api apps/worker packages/shared-py

      - name: Test Python
        run: pytest

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker Compose services
        run: docker compose build
